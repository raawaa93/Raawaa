name: Cloudflare Pages production deploy

on:
  push:
    branches:
      - 'production-deploy/**'

permissions:
  contents: read

concurrency:
  group: raawaa-pages-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical main source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and validate clean Pages payload
        run: node scripts/build-deploy.mjs "$RUNNER_TEMP/raawaa-pages"

      - name: Verify this release trigger matches current main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          TRIGGER_PARENT="$(git rev-parse "${GITHUB_SHA}^")"
          if [[ "$TRIGGER_PARENT" != "$SOURCE_SHA" ]]; then
            echo "Release trigger does not target the current main commit."
            echo "Trigger parent: $TRIGGER_PARENT"
            echo "Current main: $SOURCE_SHA"
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Deploy canonical main to Cloudflare production
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1277e30c7a5bfac599ceb3c471328a24
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "CLOUDFLARE_API_TOKEN is required."
            exit 1
          fi
          npx --yes wrangler@4 pages deploy "$RUNNER_TEMP/raawaa-pages" --project-name=raawaa-store --branch=main --commit-hash="$SOURCE_SHA" --commit-message="Production release of canonical main $SOURCE_SHA"
