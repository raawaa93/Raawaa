name: Generate reproducible npm lockfile (one-off)

on:
  push:
    branches:
      - automation/generate-lockfile-2026-11-15

permissions:
  contents: write

concurrency:
  group: rawaa-lockfile-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate clean installation
        run: |
          set -euo pipefail
          test -s package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls --depth=0
          git diff --exit-code -- package.json
      - name: Audit locked dependency tree
        run: |
          if npm audit --audit-level=high; then
            echo "No high/critical npm advisories." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::npm audit returned non-zero; inspect the audit output before merging the lockfile."
          fi
      - name: Commit lockfile and remove one-off workflow
        run: |
          set -euo pipefail
          rm .github/workflows/generate-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A package-lock.json .github/workflows/generate-lockfile.yml
          if git diff --cached --quiet; then
            echo "::error::No lockfile changes were produced."
            exit 1
          fi
          git commit -m "chore: add reproducible npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
