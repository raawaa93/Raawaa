name: Read-only Supabase Edge Function source recovery

on:
  push:
    branches:
      - recovery/inspect-edge-functions-2026-11-15
    paths:
      - '.github/workflows/inspect-edge-functions.yml'

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Check whether a Supabase access token is available
        id: auth
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN is not configured; no source was downloaded."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js
        if: steps.auth.outputs.available == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Download deployed function source without changing either project
        if: steps.auth.outputs.available == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/supabase-core" "$RUNNER_TEMP/supabase-fallback"
          cd "$RUNNER_TEMP/supabase-core"
          npx --yes supabase@latest functions download --project-ref oyoyozdugicmnkfhjovo --use-api
          cd "$RUNNER_TEMP/supabase-fallback"
          npx --yes supabase@latest functions download --project-ref xuwtuhfqjjwszxqkmivj --use-api
          tar -czf "$RUNNER_TEMP/edge-functions-sources.tar.gz" -C "$RUNNER_TEMP" supabase-core supabase-fallback
          sha256sum "$RUNNER_TEMP/edge-functions-sources.tar.gz"
      - name: Upload source archive for private review
        if: steps.auth.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: supabase-edge-function-source-review
          path: ${{ runner.temp }}/edge-functions-sources.tar.gz
          retention-days: 2
