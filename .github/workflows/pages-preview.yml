name: Cloudflare Pages preview

on:
  push:
    branches:
      - 'preview-deploy/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raawaa-pages-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical main source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and validate clean Pages payload
        run: node scripts/build-deploy.mjs "$RUNNER_TEMP/raawaa-pages"

      - name: Record exact source commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy isolated preview only
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1277e30c7a5bfac599ceb3c471328a24
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          DEPLOY_BRANCH="raawaa-recovery-preview"
          if [[ "$DEPLOY_BRANCH" == "main" ]]; then
            echo "Refusing to deploy the production branch from this workflow."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "deployment=skipped" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not configured; no Cloudflare deployment was attempted."
            exit 0
          fi
          npx --yes wrangler@4 pages deploy "$RUNNER_TEMP/raawaa-pages" --project-name=raawaa-store --branch="$DEPLOY_BRANCH" --commit-hash="$SOURCE_SHA" --commit-message="Isolated preview of canonical main $SOURCE_SHA"
          echo "deployment=created" >> "$GITHUB_OUTPUT"
          echo "Preview branch: $DEPLOY_BRANCH"
          echo "Source SHA: $SOURCE_SHA"
