name: RAWAA visual QA audit

on:
  pull_request:
    paths:
      - '**.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'scripts/visual-audit.mjs'
      - '.github/workflows/visual-qa.yml'
  push:
    branches:
      - main
      - 'qa/visual-audit-*'
    paths:
      - 'scripts/visual-audit.mjs'
      - '.github/workflows/visual-qa.yml'
  # zizmor: ignore[dangerous-triggers]
  # Safe exception: this workflow checks out the default branch, has read-only contents permission,
  # receives no secrets, and audits only fixed public Pages URLs after successful deploy workflows.
  workflow_run:
    workflows:
      - Cloudflare Pages preview
      - RAWAA automatic production CI and release
    types:
      - completed
    branches:
      - 'preview-deploy/**'
      - main
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rawaa-visual-qa
  cancel-in-progress: true

jobs:
  visual-audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Capture isolated preview pages on iPhone and desktop
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Playwright test dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium webkit
      - name: Select production or preview audit target
        id: target
        shell: bash
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name || '' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "base_url=https://127.0.0.1:4173" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_run" && "$WORKFLOW_NAME" == "RAWAA automatic production CI and release" ]]; then
            echo "base_url=https://raawaa-store.pages.dev" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "base_url=https://raawaa-store.pages.dev" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=https://raawaa-recovery-preview.raawaa-store.pages.dev" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate ephemeral HTTPS certificate
        if: github.event_name == 'pull_request'
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/rawaa-visual.key -out /tmp/rawaa-visual.crt -days 1 -nodes -subj "/CN=127.0.0.1"
      - name: Start local pull-request site
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          TLS_CERT: /tmp/rawaa-visual.crt
          TLS_KEY: /tmp/rawaa-visual.key
        run: |
          set -euo pipefail
          python3 tests/e2e/https-server.py > /tmp/rawaa-visual-qa-https.log 2>&1 &
          for attempt in {1..20}; do
            if curl --insecure --fail --silent https://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rawaa-visual-qa-https.log
          exit 1
      - name: Capture screenshots and inspect layout
        env:
          BASE_URL: ${{ steps.target.outputs.base_url }}
        run: node scripts/visual-audit.mjs
      - name: Upload visual QA report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rawaa-visual-qa-${{ github.run_id }}
          path: artifacts/visual-audit/
          if-no-files-found: warn
          retention-days: 30
      - name: Add report link to workflow summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/visual-audit/report.json ]]; then
            echo '## RAWAA Visual QA' >> "$GITHUB_STEP_SUMMARY"
            echo 'Screenshots and the HTML report are attached as the workflow artifact: rawaa-visual-qa-${{ github.run_id }}.' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/visual-audit/report.json >> "$GITHUB_STEP_SUMMARY"
          fi
