name: Store checks
on:
  push:
    # Main pushes run the full production validation pipeline; keep this workflow for recovery branches and PRs.
    branches:
      - 'recovery/**'
      - 'restore/**'
  pull_request:
    branches:
      - main
      - 'recovery/**'
concurrency:
  group: rawaa-store-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate store policy and page integrity
        run: node scripts/check-site.mjs
      - name: Build and validate clean Pages payload
        run: node scripts/build-deploy.mjs "$RUNNER_TEMP/raawaa-pages"
      - name: Test repository cleanup policy
        run: node --test tests/unit/*.test.cjs
      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './recovery/*' -print0)
