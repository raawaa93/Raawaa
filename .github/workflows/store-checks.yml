name: Store checks
on:
  push:
    branches:
      - main
      - 'recovery/**'
      - 'restore/**'
  pull_request:
    branches:
      - main
      - 'recovery/**'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate store policy and page integrity
        run: node scripts/check-site.mjs
      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './recovery/*' -print0)
