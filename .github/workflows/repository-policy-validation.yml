name: RAWAA repository policy validation

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/branch-archive-policy.cjs'
      - 'tests/unit/branch-archive-policy.test.cjs'
      - '.github/workflows/repository-policy-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/branch-archive-policy.cjs'
      - 'tests/unit/branch-archive-policy.test.cjs'
      - '.github/workflows/repository-policy-validation.yml'

permissions:
  contents: read

concurrency:
  group: rawaa-repository-policy-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test exact-SHA branch archival policy
        run: node --test tests/unit/branch-archive-policy.test.cjs
