name: RAWAA mobile performance audit

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "css/**"
      - "js/**"
      - "assets/**"
      - "lighthouserc.json"
      - "lighthouserc.pr.json"
      - ".github/workflows/performance-audit.yml"
      - "scripts/build-deploy.mjs"
  pull_request:
    paths:
      - "**/*.html"
      - "css/**"
      - "js/**"
      - "assets/**"
      - "lighthouserc.json"
      - "lighthouserc.pr.json"
      - ".github/workflows/performance-audit.yml"
      - "scripts/build-deploy.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raawaa-mobile-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lighthouse:
    name: Collect mobile performance baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Python static server
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run Lighthouse CI without hosted upload
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            npx --yes @lhci/cli@0.16.0 autorun --config=lighthouserc.pr.json
          else
            npx --yes @lhci/cli@0.16.0 autorun --config=lighthouserc.json
          fi

      - name: Upload reports for review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raawaa-lighthouse-mobile-${{ github.sha }}
          path: .lighthouseci/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
