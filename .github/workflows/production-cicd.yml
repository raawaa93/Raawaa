name: RAWAA production CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raawaa-production-cicd
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate, test, and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Generate ephemeral HTTPS certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/rawaa-e2e.key -out /tmp/rawaa-e2e.crt -days 1 -nodes -subj "/CN=127.0.0.1"

      - name: Run browser regression tests
        env:
          TLS_CERT: /tmp/rawaa-e2e.crt
          TLS_KEY: /tmp/rawaa-e2e.key
        run: npm run test:e2e

      - name: Validate store policy and page integrity
        run: node scripts/check-site.mjs

      - name: Build and validate clean Cloudflare Pages payload
        run: node scripts/build-deploy.mjs "$RUNNER_TEMP/raawaa-pages"

      - name: Confirm this is still the latest main commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main --depth=1
          MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          if [[ "$MAIN_SHA" != "$GITHUB_SHA" ]]; then
            echo "Current main has moved to $MAIN_SHA; skipping this stale deployment."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Deploy validated main to Cloudflare Pages production
        if: steps.source.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1277e30c7a5bfac599ceb3c471328a24
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN. Add it in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          SOURCE_MESSAGE="$(git log -1 --format=%s "$SOURCE_SHA")"
          npx --yes wrangler@4 pages deploy "$RUNNER_TEMP/raawaa-pages" --project-name=raawaa-store --branch=main --commit-hash="$SOURCE_SHA" --commit-message="Automated production deploy: $SOURCE_MESSAGE"
