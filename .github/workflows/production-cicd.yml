name: RAWAA production CI and release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'AGENTS.md'
      - '.agents/**'
      - '.github/workflows/**'
      - 'recovery/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.mjs'
      - 'tests/**'
      - 'scripts/check-site.mjs'
      - 'scripts/check-production-headers.mjs'
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Deploy the validated main commit to Cloudflare production"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: raawaa-production-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate canonical main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit locked dependencies
        run: npm audit --audit-level=high

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Generate ephemeral HTTPS certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/rawaa-e2e.key -out /tmp/rawaa-e2e.crt -days 1 -nodes -subj "/CN=127.0.0.1"

      - name: Run browser regression tests
        env:
          TLS_CERT: /tmp/rawaa-e2e.crt
          TLS_KEY: /tmp/rawaa-e2e.key
        run: npm run test:e2e

      - name: Validate store policy and page integrity
        run: node scripts/check-site.mjs

      - name: Build and validate clean Cloudflare Pages payload
        run: node scripts/build-deploy.mjs "$RUNNER_TEMP/raawaa-pages"

      - name: Verify validation did not modify tracked or untracked source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            echo "::error::Validation modified the source checkout."
            exit 1
          fi

  deploy:
    name: Validated automatic production release
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm_production == 'yes'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://raawaa-store.pages.dev
    steps:
      - name: Checkout exact validated main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Rebuild clean Cloudflare Pages payload
        run: node scripts/build-deploy.mjs "$RUNNER_TEMP/raawaa-pages"

      - name: Confirm this is still the latest main commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main --depth=1
          MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          if [[ "$MAIN_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Main moved to $MAIN_SHA after validation; refusing to deploy stale source."
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            echo "::error::Source checkout is dirty; refusing deployment."
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Deploy validated main to Cloudflare Pages production
        if: steps.source.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1277e30c7a5bfac599ceb3c471328a24
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          SOURCE_MESSAGE="$(git log -1 --format=%s "$SOURCE_SHA")"
          npx --yes wrangler@4 pages deploy "$RUNNER_TEMP/raawaa-pages" --project-name=raawaa-store --branch=main --commit-hash="$SOURCE_SHA" --commit-message="Automatically released after successful main validation: $SOURCE_MESSAGE"
 
      - name: Verify published security headers
        run: node scripts/check-production-headers.mjs
