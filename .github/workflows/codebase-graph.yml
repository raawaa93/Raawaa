name: RAWAA codebase knowledge graph

on:
  push:
    branches:
      - main
      - "automation/**"
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.mjs"
      - "css/**"
      - "scripts/**"
      - "AGENTS.md"
      - "docs/engineering/PROJECT-MEMORY.md"
      - ".graphifyignore"
      - ".github/workflows/codebase-graph.yml"
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.mjs"
      - "css/**"
      - "scripts/**"
      - "AGENTS.md"
      - "docs/engineering/PROJECT-MEMORY.md"
      - ".graphifyignore"
      - ".github/workflows/codebase-graph.yml"
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: read

concurrency:
  group: raawaa-codebase-graph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  graph:
    name: Build offline source graph
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned Graphify CLI
        run: python -m pip install --disable-pip-version-check "graphifyy==0.9.109"

      - name: Build code-only graph without model/API calls
        env:
          GRAPHIFY_BACKEND: none
          GRAPHIFY_QUERY_LOG_DISABLE: "1"
        run: |
          set -euo pipefail
          graphify extract . --code-only --max-workers 2 --out "$RUNNER_TEMP/raawaa-graph"
          graphify cluster-only "$RUNNER_TEMP/raawaa-graph" --no-label
          test -s "$RUNNER_TEMP/raawaa-graph/graphify-out/graph.json"
          test -s "$RUNNER_TEMP/raawaa-graph/graphify-out/GRAPH_REPORT.md"

      - name: Preserve graph as a short-lived downloadable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raawaa-codebase-graph-${{ github.sha }}
          path: |
            ${{ runner.temp }}/raawaa-graph/graphify-out/graph.json
            ${{ runner.temp }}/raawaa-graph/graphify-out/GRAPH_REPORT.md
            ${{ runner.temp }}/raawaa-graph/graphify-out/graph.html
          if-no-files-found: error
          retention-days: 14
