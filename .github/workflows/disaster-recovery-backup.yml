name: RAWAA disaster-recovery backup

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: rawaa-disaster-recovery-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Create verifiable repository backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create Git bundle and source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          git bundle create backup/rawaa-full-history.bundle --all
          git archive --format=tar.gz --prefix=rawaa/ HEAD > backup/rawaa-source-${GITHUB_SHA}.tar.gz
          printf '%s\n' "$GITHUB_SHA" > backup/source-commit.txt
          git bundle verify backup/rawaa-full-history.bundle
          (cd backup && sha256sum rawaa-full-history.bundle rawaa-source-${GITHUB_SHA}.tar.gz source-commit.txt > SHA256SUMS)
          cat backup/SHA256SUMS

      - name: Upload recovery package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rawaa-disaster-recovery-${{ github.run_id }}-${{ github.sha }}
          path: backup/
          if-no-files-found: error
          retention-days: 90
