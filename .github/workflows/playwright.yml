name: Playwright browser checks

on:
  pull_request:
    paths:
      - '**.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'tests/e2e/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/playwright.yml'
  push:
    # Main pushes run the full production validation pipeline; retain recovery/restore branch coverage.
    branches: ['recovery/**', 'restore/**']
    paths:
      - '**.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'tests/e2e/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/playwright.yml'

concurrency:
  group: rawaa-playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit locked dependencies
        run: npm audit --audit-level=high
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Generate ephemeral HTTPS certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/rawaa-e2e.key -out /tmp/rawaa-e2e.crt -days 1 -nodes -subj "/CN=127.0.0.1"
      - name: Run browser checks
        env:
          TLS_CERT: /tmp/rawaa-e2e.crt
          TLS_KEY: /tmp/rawaa-e2e.key
        run: npm run test:e2e
