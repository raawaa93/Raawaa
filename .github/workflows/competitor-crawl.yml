name: RAWAA competitor intelligence crawl

on:
  pull_request:
    paths:
      - ".github/workflows/competitor-crawl.yml"
      - "scripts/competitor_crawl.py"
      - "tests/unit/test_competitor_crawl.py"
      - "docs/engineering/competitor-targets.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/competitor-crawl.yml"
      - "scripts/competitor_crawl.py"
      - "docs/engineering/competitor-targets.json"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rawaa-competitor-crawl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Test extraction and robots policy
        run: python -m unittest discover -s tests/unit -p "test_competitor_crawl.py" -v

  crawl:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned open-source crawler
        run: |
          python -m pip install --upgrade pip
          python -m pip install "crawl4ai==0.9.5"
      - name: Install Chromium and system dependencies
        run: |
          python -m playwright install --with-deps chromium
          crawl4ai-doctor
      - name: Crawl approved public competitor pages
        run: python scripts/competitor_crawl.py
      - name: Upload crawl snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rawaa-competitor-crawl-${{ github.run_id }}
          path: artifacts/competitor-crawl/
          if-no-files-found: warn
          retention-days: 30
